version: "1.0"
ruleGroups:
  - name: "Auto-injected cache step validation"
    conditionExpression:
      operator: "OR"
      conditions:
        - key: "standardOutput"
          operand: "contains"
          value: "ERRCAT_AUTO_CACHE_FAILURE"
        - key: "standardErrorOutput"
          operand: "contains"
          value: "ERRCAT_AUTO_CACHE_FAILURE"
        - key: "standardOutput"
          operand: "contains"
          value: "NoSuchBucket"
        - key: "standardErrorOutput"
          operand: "contains"
          value: "NoSuchBucket"
        - key: "standardOutput"
          operand: "contains"
          value: "AccessDenied"
        - key: "standardErrorOutput"
          operand: "contains"
          value: "AccessDenied"
    actions:
      - type: "setErrorCategory"
        value: "APPLICATION_FAILURE"
      - type: "setErrorSubcategory"
        value: "DEPENDENCY_ISSUE"
      - type: "setErrorMessage"
        value: "errors.yml matched an auto-injected CI cache step."
